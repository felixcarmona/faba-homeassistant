services:
  faba-bridge:
    build: .
    container_name: faba-bridge
    network_mode: host          # listens on 127.0.0.1:8090 only; Home Assistant polls it locally
    restart: unless-stopped
    env_file:
      - .env                    # MYFABA_USER / MYFABA_PASS, see .env.example
    environment:
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
